<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04121f">
<title>Vaani Remote</title>
<style>
  :root { --bg:#04121f; --card:#0a2236; --line:#143653; --fg:#eaf9ff; --dim:#7fa3b8; --acc:#2bd4ff; --me:#0f4c6e; --ok:#35e08a; --bad:#ff5d6c; }
  @media (prefers-color-scheme: light) { :root { --bg:#f3f8fb; --card:#ffffff; --line:#cfe0ea; --fg:#0b2233; --dim:#5b7a8c; --acc:#0a8fb8; --me:#d6f0fb; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .hide { display: none !important; }
  #login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .box { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  h1 { margin: 0 0 4px; font-size: 22px; color: var(--acc); }
  p.sub { margin: 0 0 16px; color: var(--dim); font-size: 14px; }
  input, textarea { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; outline: none; }
  input:focus, textarea:focus { border-color: var(--acc); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 12px 16px; background: var(--acc); color: #00202c; font-weight: 600; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); padding: 6px 10px; font-weight: 500; font-size: 13px; }
  button.ghost.on { color: var(--acc); border-color: var(--acc); }
  #err { color: var(--bad); font-size: 14px; min-height: 20px; margin: 8px 0 0; }
  #app { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header .t { font-weight: 700; color: var(--acc); flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); display: inline-block; margin-right: 6px; }
  .dot.on { background: var(--ok); }
  #st { font-size: 13px; color: var(--dim); }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 86%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; border: 1px solid var(--line); }
  .m.user { align-self: flex-end; background: var(--me); }
  .m.vaani { align-self: flex-start; background: var(--card); }
  .m.sys { align-self: center; color: var(--dim); font-size: 13px; border-style: dashed; background: transparent; }
  .quick { display: flex; gap: 8px; padding: 0 14px 8px; overflow-x: auto; }
  .quick button { white-space: nowrap; padding: 6px 12px; font-size: 13px; font-weight: 500; background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  form { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
  textarea { resize: none; max-height: 120px; }
  #mic { background: var(--card); color: var(--fg); border: 1px solid var(--line); padding: 12px 14px; }
  #mic.rec { background: var(--bad); color: #fff; border-color: var(--bad); }
</style>
</head>
<body>
<div id="login" class="hide">
  <div class="box">
    <h1>Vaani Remote</h1>
    <p class="sub">Apne phone ko kahin se bhi control karo.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <p id="err"></p>
    <button id="go" style="width:100%">Login</button>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <span class="t">Vaani</span>
    <span id="st"><span class="dot" id="dot"></span><span id="stt">...</span></span>
    <button class="ghost" id="tts" title="Jawab bolkar sunao">Awaaz</button>
    <button class="ghost" id="out">Logout</button>
  </header>
  <div id="log"></div>
  <div class="quick" id="quick"></div>
  <form id="f">
    <button type="button" id="mic" title="Bolkar bhejo">Mic</button>
    <textarea id="t" rows="1" placeholder="Vaani ko kaam batao..."></textarea>
    <button type="submit">Bhejo</button>
  </form>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var since = 0, polling = false, speak = false, first = true;
  try { speak = localStorage.getItem("tts") === "1"; } catch (e) {}

  function api(path, method, body) {
    return fetch(path, { method: method || "GET", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, data: j }; }); });
  }

  function show(which) {
    $("login").classList.toggle("hide", which !== "login");
    $("app").classList.toggle("hide", which !== "app");
  }

  function setOnline(on) {
    $("dot").classList.toggle("on", !!on);
    $("stt").textContent = on ? "Phone online" : "Phone offline";
  }

  // v5.33 — Robotic voice (browser speechSynthesis) sirf fallback hai.
  function speakRobot(text) {
    if (!window.speechSynthesis) return;
    try { var u = new SpeechSynthesisUtterance(text); u.lang = "hi-IN"; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
  }

  // v5.33 — Gemini voice: phone ne reply ke saath audio bheja ho to wahi bajao, nahi to robotic.
  function playB64Wav(b64) {
    var bin = atob(b64); var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
    var a = new Audio(url);
    a.onended = function () { URL.revokeObjectURL(url); };
    return a.play();
  }
  function speakGemini(m) {
    api("/api/audio?n=" + m.n).then(function (r) {
      if (r.status === 200 && r.data && r.data.audio) {
        playB64Wav(r.data.audio).catch(function () { speakRobot(m.text); });
      } else speakRobot(m.text);
    }).catch(function () { speakRobot(m.text); });
  }

  function add(m) {
    var d = document.createElement("div");
    d.className = "m " + m.role;
    d.textContent = m.text;
    var log = $("log");
    var atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    log.appendChild(d);
    if (atBottom || m.role === "user") log.scrollTop = log.scrollHeight;
    if (!first && m.role === "vaani" && speak) {
      if (m.audio) speakGemini(m); else speakRobot(m.text);
    }
  }

  function poll() {
    if (polling) return;
    polling = true;
    (function loop(init) {
      api("/api/poll?since=" + since + (init ? "&init=1" : "")).then(function (r) {
        if (r.status === 401) { polling = false; show("login"); return; }
        var d = r.data || {};
        (d.items || []).forEach(function (m) { add(m); since = Math.max(since, m.n); });
        if (typeof d.seq === "number" && since < d.seq && !(d.items || []).length) since = d.seq;
        if (init) first = false;
        setOnline(d.online);
        loop(false);
      }).catch(function () { setOnline(false); setTimeout(function () { loop(false); }, 3000); });
    })(true);
  }

  function sendText(text) {
    text = (text || "").trim();
    if (!text) return;
    api("/api/send", "POST", { text: text }).then(function (r) {
      if (r.status === 401) show("login");
    });
  }

  function start() {
    show("app");
    $("tts").classList.toggle("on", speak);
    poll();
  }

  $("go").onclick = function () {
    $("err").textContent = "";
    api("/api/login", "POST", { password: $("pw").value }).then(function (r) {
      if (r.status === 200) { $("pw").value = ""; start(); }
      else $("err").textContent = (r.data && r.data.error) || "Login nahi hua.";
    });
  };
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });
  $("out").onclick = function () { api("/api/logout", "POST", {}).then(function () { location.reload(); }); };
  $("tts").onclick = function () {
    speak = !speak; $("tts").classList.toggle("on", speak);
    try { localStorage.setItem("tts", speak ? "1" : "0"); } catch (e) {}
  };

  $("f").onsubmit = function (e) { e.preventDefault(); var v = $("t").value; $("t").value = ""; $("t").style.height = "auto"; sendText(v); };
  $("t").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); } });
  $("t").addEventListener("input", function () { this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 120) + "px"; });

  // Quick buttons
  ["Battery kitna hai", "Aaj ka briefing", "Mera location batao", "Naye messages padho", "Torch on karo"].forEach(function (q) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = q;
    b.onclick = function () { sendText(q); };
    $("quick").appendChild(b);
  });

  // Mic (browser ka speech recognition: Chrome / Edge / Safari)
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $("mic").classList.add("hide"); }
  else {
    var rec = null, recOn = false;
    $("mic").onclick = function () {
      if (recOn && rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = "hi-IN"; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onstart = function () { recOn = true; $("mic").classList.add("rec"); $("mic").textContent = "Sun raha hu"; };
      rec.onend = function () { recOn = false; $("mic").classList.remove("rec"); $("mic").textContent = "Mic"; };
      rec.onerror = function () { recOn = false; $("mic").classList.remove("rec"); $("mic").textContent = "Mic"; };
      rec.onresult = function (ev) { var t = ev.results[0][0].transcript; sendText(t); };
      try { rec.start(); } catch (e) {}
    };
  }

  api("/api/me").then(function (r) { if (r.status === 200) start(); else show("login"); }).catch(function () { show("login"); });
})();
</script>
</body>
</html>

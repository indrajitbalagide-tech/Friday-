name: Build Vaani APK

# Vaani v5.16 ke liye — zip wali flow (jaise pehle v5.8 mein thi), lekin ab:
#   - Release APK banta hai (GitHub Secrets wali keystore se sign) — debug nahi
#   - Build ke baad khud GitHub Release banata hai + update.json update karta hai
#   - Phone har 6 ghante mein update.json check karke khud update ho jata hai
# Secrets na hon to debug APK banta hai (phir har update par uninstall karna padega).
# Repo root mein zip file honi chahiye (jaise Vaani_v5.16.zip) — workflow use unzip karke banata hai.

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths-ignore:
      - update.json
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VAANI_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      VAANI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      VAANI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip project zip
        run: |
          ZIP=$(ls *.zip | head -1)
          if [ -n "$ZIP" ]; then unzip -o "$ZIP"; fi
          if [ -f Vaani/settings.gradle.kts ]; then echo "PROJECT_DIR=Vaani" >> $GITHUB_ENV; else echo "PROJECT_DIR=." >> $GITHUB_ENV; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore (GitHub secrets)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/vaani-release.keystore"

      - name: Build release APK (signed, same key)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VAANI_STORE_FILE: ${{ github.workspace }}/vaani-release.keystore
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Build debug APK (no signing key)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vaani-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Auto-release + update.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' ${{ env.PROJECT_DIR }}/app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' ${{ env.PROJECT_DIR }}/app/build.gradle.kts)
          if [ -f ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk ]; then
            APK=${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk; NAME=app-release.apk
          else
            APK=${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk; NAME=app-debug.apk
          fi
          TAG="v$VERSION"
          echo "Releasing $TAG (code $CODE) with $APK"
          gh release create "$TAG" --title "Vaani $VERSION" \
            --notes "Auto-build from main (versionCode $CODE)." "$APK" \
            || gh release upload "$TAG" "$APK" --clobber
          REPO="${{ github.repository }}"
          APK_URL="https://github.com/$REPO/releases/download/$TAG/$NAME"
          python3 - "$CODE" "$VERSION" "$APK_URL" <<'EOF'
          import json, sys
          code, version, url = int(sys.argv[1]), sys.argv[2], sys.argv[3]
          data = {"versionCode": code, "versionName": version, "apkUrl": url,
                  "notes": "Vaani %s — auto-build." % version}
          open("update.json", "w").write(json.dumps(data))
          EOF
          git config user.name "vaani-bot"
          git config user.email "vaani-bot@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update.json for $TAG [skip ci]" || echo "update.json unchanged"
          git push
